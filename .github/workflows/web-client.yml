name: Web client

on:
  push:
    branches: [ "master", "main" ]
    paths:
      - "Mage.Web.Client/**"
      - ".github/workflows/web-client.yml"
  pull_request:
    paths:
      - "Mage.Web.Client/**"
      - ".github/workflows/web-client.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mage.Web.Client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: Mage.Web.Client/.nvmrc
          cache: npm
          cache-dependency-path: Mage.Web.Client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # fails when the app's JS grows past the budget in scripts/check-bundle-size.mjs; prints the sizes
      - id: size
        run: npm run size
      - name: Compare an exceeded budget with the deployed baseline
        if: failure() && steps.size.outcome == 'failure'
        run: bash scripts/compare-bundle-baseline.sh a91940d78ba00db8539c8eed291db0b5d5ab5c44

  # Playwright: the specs that need no game server (sign-in, axe on the sign-in screen) against the
  # production build served by `vite preview`. Specs that play on a live server skip here (they need
  # MAGE_E2E_REQUIRE_SERVER=1 and a running Java server); see Mage.Web.Client/README.md to run them.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Mage.Web.Client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: Mage.Web.Client/.nvmrc
          cache: npm
          cache-dependency-path: Mage.Web.Client/package-lock.json
      - run: npm ci
      # the browser download (about 170 MB) is cached per Playwright version; the system packages it needs aren't
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run build
      - run: npm run test:e2e:ci
      - name: Compile isolated payment and presentation fixtures with production minification
        run: PLAYMAT_UI_TEST_FIXTURES=yes npm run build
      - name: Minified mana payment and presentation mobile/desktop fixtures
        run: MAGE_WEB_E2E_PREVIEW=1 PLAYMAT_PAYMENT_FIXTURE_BUILT=1 npx playwright test e2e/mana-payment.spec.ts e2e/stack-targets.spec.ts e2e/chat-social.spec.ts --project=chromium-desktop --workers=1
      - name: Stack arrow fixture screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stack-target-ui-fixtures
          path: Mage.Web.Client/test-results/**/stack-targets-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Chat and social fixture screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-social-ui-fixtures
          path: Mage.Web.Client/test-results/e2e-chat-social-*/**/*.png
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            Mage.Web.Client/playwright-report
            Mage.Web.Client/test-results
          retention-days: 7
